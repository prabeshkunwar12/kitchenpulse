services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen_dev
      POSTGRES_DB: kitchen
    volumes: [data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kitchen']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg://kitchen:kitchen_dev@db/kitchen
    depends_on:
      db:
        condition: service_healthy
volumes:
  data:
